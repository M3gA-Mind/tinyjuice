[package]
name = "tinyjuice-cli"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"
description = "Standalone TinyJuice command-line tools."
repository = "https://github.com/tinyhumansai/tinyjuice"

[dependencies]
tinyjuice = { path = "../.." }
tinyjuice-drivers = { path = "../tinyjuice-drivers" }
tinystoragedrivers = { version = "2.0.1", git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", features = ["file"] }
dirs = "7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tinyjuice"
path = "src/bin/tinyjuice.rs"

[[bin]]
name = "tinyjuice-reduce"
path = "src/bin/tinyjuice-reduce.rs"
