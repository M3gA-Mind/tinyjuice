[package]
rust-version = "1.90"
name = "tinyjuice-module"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyJuice."
repository = "https://github.com/tinyhumansai/tinyjuice"
publish = false

[features]
# Link this adapter into a host binary without exporting the shared C names.
static-link = []
linked = ["static-link"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyjuice = { path = "../..", default-features = false, features = ["jq"] }
# The interface vocabulary. Shared with hosts, so this adapter cannot drift
# from what a caller was compiled against.
tinyjuice-bus = { path = "../tinyjuice-bus" }
tinybus = { version = "=0.1.6", git = "https://github.com/senamakel/tinybus", rev = "1d0aa34104c84f6817f398b0abe164df6c5e7b82", default-features = false, features = ["macros", "modules"] }
tinybus-module = { version = "=0.1.6", git = "https://github.com/senamakel/tinybus", rev = "1d0aa34104c84f6817f398b0abe164df6c5e7b82" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
# The CCR store's durable tier is blobs on the host's storage ports, reached
# over the storage bus. The module has no storage backend or file of its own.
tinyjuice-drivers = { path = "../tinyjuice-drivers" }
tinystoragedrivers-api = { version = "2.0.2", git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.2" }
tinystoragedrivers-types = { version = "2.0.2", git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.2" }
tinystoragedrivers-busproxy = { version = "2.0.2", git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.2" }
log = "0.4"

[dev-dependencies]
# Tests serve the storage objects on the in-memory broker the module connects to.
tinystoragedrivers-testkit = { version = "2.0.2", git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.2" }
tinybus = { version = "=0.1.6", git = "https://github.com/senamakel/tinybus", rev = "1d0aa34104c84f6817f398b0abe164df6c5e7b82", default-features = false, features = ["test-support"] }
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
