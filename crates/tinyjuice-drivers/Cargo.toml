[package]
rust-version = "1.90"
name = "tinyjuice-drivers"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-only"
description = "TinyJuice on the tinystoragedrivers ports: the CCR store as expiring blobs."
repository = "https://github.com/tinyhumansai/tinyjuice"
# Not published: it depends on `tinystoragedrivers-core` by git tag, which a
# crates.io package cannot do. The published crates stay free of any storage
# dependency.
publish = false

[dependencies]
tinyjuice-bus = { path = "../tinyjuice-bus" }
tinyjuice = { path = "../..", default-features = false }
tinystoragedrivers-api = { version = "2.1.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6bc73c82da12d0f6035f8d85b27293d197dcb312" }
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6bc73c82da12d0f6035f8d85b27293d197dcb312" }
log = "0.4"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
async-trait = "0.1"
tinystoragedrivers-testkit = { version = "2.1.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6bc73c82da12d0f6035f8d85b27293d197dcb312" }
tinystoragedrivers-blob = { version = "2.1.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6bc73c82da12d0f6035f8d85b27293d197dcb312" }
